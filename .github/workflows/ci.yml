name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fallow:
    name: Fallow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fallow's health analysis reads git history for churn and hotspots.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Fallow
        run: npx --yes fallow@3.2.0

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

  build:
    name: Build (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        # The same three runners as the publish job in release.yml. Packaging
        # copies the native `pg` and `@libsql` packages out of node_modules, so
        # a packaging break is often specific to one platform, and without
        # these it would first show up in a release.
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # macOS packages the universal app the release ships, because merging
      # the two slices is the step most likely to break there: it fails when a
      # native binding exists in only one of them. Unsigned, since pull
      # requests get no Apple secrets.
      - name: Build (macOS)
        if: startsWith(matrix.os, 'macos')
        run: yarn package:mac

      - name: Build
        if: ${{ !startsWith(matrix.os, 'macos') }}
        run: yarn package
