name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fallow:
    name: Fallow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fallow's health analysis reads git history for churn and hotspots.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Fallow
        run: npx --yes fallow@3.2.0

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test:coverage

      # Puts the totals on the run's summary page, so nobody has to download
      # the report to see them. It runs even when a test failed, since the
      # numbers are still worth having then.
      - name: Coverage summary
        if:
          ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != ''
          }}
        run: |
          node -e '
            const { total } = require("./coverage/coverage-summary.json")
            const rows = ["lines", "statements", "functions", "branches"].map(
              (name) => `| ${name} | ${total[name].pct}% | ${total[name].covered} / ${total[name].total} |`
            )
            console.log(["## Coverage", "", "| | % | Covered |", "| --- | --- | --- |", ...rows].join("\n"))
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 14

  build:
    name: Build (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        # The same three runners as the publish job in release.yml. Packaging
        # copies the native `pg` and `@libsql` packages out of node_modules, so
        # a packaging break is often specific to one platform, and without
        # these it would first show up in a release.
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # macOS packages the universal app the release ships, because merging
      # the two slices is the step most likely to break there: it fails when a
      # native binding exists in only one of them. Unsigned, since pull
      # requests get no Apple secrets.
      - name: Build (macOS)
        if: startsWith(matrix.os, 'macos')
        run: yarn package:mac

      - name: Build
        if: ${{ !startsWith(matrix.os, 'macos') }}
        run: yarn package
