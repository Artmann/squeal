name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'

    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64; macos-15-intel is x64. Two runners rather than
        # one cross-arch build: libsql ships per-arch native bindings as optional
        # dependencies and forge's packageAfterCopy hook copies node_modules
        # straight from the host, so only the runner's own architecture is right.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install

      # forge.config.ts skips signing when APPLE_TEAM_ID is unset, so a missing
      # secret would quietly ship an unsigned app that macOS refuses to open.
      # Fail here instead.
      - name: Check Apple signing secrets
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          APPLE_APP_SPECIFIC_PASSWORD:
            ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()

          for name in APPLE_APP_SPECIFIC_PASSWORD APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Cannot build a distributable macOS app. Missing repository secrets: ${missing[*]}. Add them under Settings -> Secrets and variables -> Actions, then re-run this job. Without them the app is unsigned and macOS reports it as damaged."
            exit 1
          fi

      - name: Import Apple certificate
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Decode certificate from base64
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Add keychain to search list
          security list-keychain -d user -s $KEYCHAIN_PATH

      # The secret check above cannot see an expired Apple agreement, and
      # signing succeeds without one — so the first sign of trouble is a raw
      # `HTTP status code: 403` from notarytool, two minutes into `yarn make`
      # and wrapped in a forge stack trace. This asks the notary service the
      # same question up front and names the cause instead.
      - name: Check notarization is available
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          APPLE_APP_SPECIFIC_PASSWORD:
            ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # `history` authenticates against the notary service without
          # submitting anything, and answers fine for an account that has never
          # notarized.
          if reply=$(xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" 2>&1); then
            echo "Notary service reachable and the credentials are accepted."
            exit 0
          fi

          echo "$reply"

          if printf '%s' "$reply" | grep -qi 'agreement'; then
            echo "::error::Notarization is unavailable because Apple reports a missing or expired agreement, so this build would fail later inside notarytool. The Account Holder — an Admin cannot do it — has to accept the current Apple Developer Program License Agreement at https://developer.apple.com/account and clear anything pending under App Store Connect -> Business, then re-run this job."
          else
            echo "::error::Notarization is unavailable, so this build would fail later inside notarytool. Apple's reply is above. Check that APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are still valid and that the Developer Program membership has not lapsed."
          fi

          exit 1

      - name: Build artifacts
        run: yarn make
        env:
          APPLE_APP_SPECIFIC_PASSWORD:
            ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_OS_LABEL: ${{ matrix.os }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          artifacts=()

          # The macOS zip is not a second download option for humans — it is the
          # only format Squirrel.Mac can install, so leaving it out of the
          # release breaks in-app updates for every existing macOS user.
          while IFS= read -r file; do
            artifacts+=("$file")
          done < <(find out/make -type f \( -name "*.exe" -o -name "*.dmg" \
            -o -name "*.deb" -o -name "*.rpm" -o -name "*.nupkg" \
            -o -name "*.zip" -o -name "RELEASES" \))

          # A bare `find -exec` exits 0 when nothing matches, which would leave
          # the release missing this platform's installer while the job still
          # looked green.
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::No installers found in out/make for $RUNNER_OS_LABEL. The makers produced nothing, so there is nothing to publish — check the Build artifacts step."
            exit 1
          fi

          printf 'Uploading %s\n' "${artifacts[@]}"

          gh release upload "$TAG_NAME" "${artifacts[@]}" --clobber
